name: Prune expired users

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: baza

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prune DB
        run: python prune_auth_db.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add auth_db.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "prune expired users"
          git push origin baza